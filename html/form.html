<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Task</title>
  </head>
  <body>
    <div>
      <h1>Register User</h1>
      <form>
        <div>
          <label for="fname">First Name</label>
          <input type="text" name="first-name" id="fname" />
        </div>
        <div>
          <label for="lname">Last Name</label>
          <input type="text" name="last-name" id="lname" />
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
        </div>

        <div>
          <label for="id">ID Number</label>
          <input type="number" name="id" id="id" />
        </div>

        <div>
          <label for="">Gender:</label>
          <br />
          <label for="male">Male</label>
          <input type="radio" name="gender" id="male" value="male" />
          <label for="female">Female</label>
          <input type="radio" name="gender" id="female" value="female" />
        </div>

        <div>
          <label for="">Nationality</label>
          <select name="nationaltiy" id="">
            <option value="JOD">JORDAN</option>
            <option value="EGYPT">EGYPT</option>
            <option value="LEBANON">LEBANON</option>
          </select>
        </div>

        <div>
          <label for="image">Proof Image</label>
          <input type="file" name="image" id="image" />
        </div>
        <div>
          <label for="">Message</label>
          <textarea name="" id="" rows="5"></textarea>
        </div>
        <div>
          <label for="">Rate your Level</label>
          <input
            type="range"
            min="0"
            max="100"
            step="5"
            name=""
            id=""
            value="1"
          />
        </div>
        <button type="submit">submit</button>
        <button type="reset">Reset</button>
      </form>
    </div>
  </body>
</html>
